[package]
name = "protocol-auditor-firmware"
version = "0.1.0"
edition = "2021"

[lib]
name = "protocol_auditor_firmware"
path = "src/lib.rs"

# Embassy firmware for the STM32F401RE (Nucleo-F401RE).
# Implements strict binary protocol parsing with CRC-8/ATM and safe resynchronization.

# Bare-metal dependencies are only needed for the thumb target. Gating them by
# target_os = "none" keeps `protocol.rs` testable natively on the host without
# compiling embassy/stm32-metapac for the host OS.
[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "stm32f401re", "unstable-pac", "time-driver-tim4", "exti"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }

[[bin]]
name = "protocol-auditor-firmware"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
