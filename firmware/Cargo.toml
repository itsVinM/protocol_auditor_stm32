[package]
name = "protocol-auditor-firmware"
version = "0.1.0"
edition = "2021"

[lib]
name = "protocol_audur_firmware"
path = "src/lib.rs"

# Embassy firmware for the STM32F401RE (Nucleo-F401RE).
# Implements strict binary protocol parsing with CRC-8/ATM and safe resynchronization.

[dependencies]
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "stm32f401re", "unstable-pac", "time-driver-any", "exti"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", features = ["defmt", "defmt-timestamp-2f", "tick-hz-32kHz"] }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", features = ["defmt"] }

[[bin]]
name = "protocol-auditor-firmware"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
