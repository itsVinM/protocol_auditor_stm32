[package]
name = "protocol-auditor-stm32"
version = "0.1.0"
edition = "2021"

# Host CLI for protocol_auditor_stm32.
# Opens a serial port to the STM32 firmware and sends crafted frames
# to audit parsing robustness (framing, CRC, safe resynchronization).

[dependencies]
serialport = { version = "4.7", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
